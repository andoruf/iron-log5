<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON LOG</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f6f8;
  color:#17202a;
  overflow:hidden;
}

header{
  background:#2563eb;
  color:#fff;
  padding:24px;
  text-align:center;
  box-shadow:0 4px 16px rgba(0,0,0,.12);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  flex:1;
  text-align:center;
}

.menu-btn{
  background:none;
  border:none;
  color:#fff;
  font-size:24px;
  cursor:pointer;
  padding:0;
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
}

main{
  max-width:760px;
  margin:auto;
  padding:16px;
  height:calc(100vh - 120px);
  overflow-y:auto;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 24px rgba(15,23,42,.08);
}

h2{
  margin-top:0;
}

input,button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #d1d5db;
  margin-top:10px;
  font-size:16px;
}

button{
  border:none;
  background:#2563eb;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  transition:all 0.2s ease;
}

button:hover{
  opacity:.9;
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(37,99,235,.3);
}

button:active{
  transform:translateY(0);
}

.save-btn{
  background:#16a34a;
}

.save-btn:hover{
  box-shadow:0 4px 12px rgba(22,163,74,.3);
}

.delete-btn{
  background:#ef4444;
  margin-top:14px;
  width:100%;
}

.delete-btn:hover{
  box-shadow:0 4px 12px rgba(239,68,68,.3);
}

.set-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.history-item{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  margin-top:12px;
  animation:slideIn 0.3s ease;
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateY(-10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes slideInRight{
  from{
    transform:translateX(100%);
  }
  to{
    transform:translateX(0);
  }
}

@keyframes slideOutRight{
  from{
    transform:translateX(0);
  }
  to{
    transform:translateX(100%);
  }
}

.small{
  color:#6b7280;
  font-size:14px;
}

.success-message{
  background:#dcfce7;
  color:#166534;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  display:none;
  animation:slideIn 0.3s ease;
}

.success-message.show{
  display:block;
}

.empty-message{
  color:#9ca3af;
  text-align:center;
  padding:20px;
  font-size:14px;
}

.exercise-btn{
  background:#f3f4f6;
  color:#17202a;
  border:1px solid #e5e7eb;
  margin:6px 0;
  padding:10px;
  border-radius:10px;
  font-weight:500;
  transition:all 0.2s ease;
}

.exercise-btn:hover{
  background:#e5e7eb;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  transform:none;
}

.exercise-list{
  margin-top:12px;
  max-height:120px;
  overflow-y:auto;
}

/* ドロワーオーバーレイ */
.drawer-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.5);
  display:none;
  z-index:99;
  animation:fadeIn 0.3s ease;
}

.drawer-overlay.show{
  display:block;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

/* ドロワー */
.drawer{
  position:fixed;
  right:0;
  top:0;
  width:80%;
  max-width:400px;
  height:100%;
  background:#fff;
  box-shadow:-4px 0 16px rgba(0,0,0,.2);
  z-index:100;
  transform:translateX(100%);
  transition:transform 0.3s ease;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
}

.drawer.show{
  transform:translateX(0);
}

.drawer-header{
  background:#2563eb;
  color:#fff;
  padding:16px;
  font-weight:700;
  font-size:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close-btn{
  background:none;
  border:none;
  color:#fff;
  font-size:24px;
  cursor:pointer;
  padding:0;
  width:40px;
  height:40px;
}

.drawer-content{
  flex:1;
  padding:16px;
  overflow-y:auto;
}

.drawer-item{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  animation:slideIn 0.3s ease;
}

.drawer-item strong{
  display:block;
  margin-bottom:8px;
}

.drawer-item .small{
  display:block;
  margin-bottom:8px;
}

.drawer-item-sets{
  background:#f9fafb;
  padding:8px;
  border-radius:8px;
  margin:8px 0;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div style="width:40px"></div>
  <div>
    <h1>IRON LOG</h1>
    <p style="margin:0;font-size:12px">筋トレメモアプリ</p>
  </div>
  <button class="menu-btn" onclick="openDrawer()">☰</button>
</header>

<main>

<div class="card">
  <div class="success-message" id="successMessage">✓ 保存しました！</div>
  <h2>種目追加</h2>

  <input type="text" id="exerciseName" placeholder="例：ベンチプレス">

  <div class="exercise-list" id="exerciseList"></div>

  <div id="sets"></div>

  <button class="save-btn" onclick="saveWorkout()">保存</button>
</div>

</main>

<!-- ドロワーオーバーレイ -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<!-- ドロワー -->
<div class="drawer" id="drawer">
  <div class="drawer-header">
    履歴
    <button class="close-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-content" id="historyDrawer"></div>
</div>

<script>
const setsContainer = document.getElementById("sets");

// セット数入力フィールドを生成
for(let i=1;i<=5;i++){
  const setGrid = document.createElement("div");
  setGrid.className = "set-grid";
  
  const kgInput = document.createElement("input");
  kgInput.type = "number";
  kgInput.id = `kg${i}`;
  kgInput.placeholder = `${i}セット目 重量(kg)`;
  kgInput.min = "0";
  kgInput.step = "0.5";
  
  const repInput = document.createElement("input");
  repInput.type = "number";
  repInput.id = `rep${i}`;
  repInput.placeholder = `${i}セット目 回数`;
  repInput.min = "0";
  
  setGrid.appendChild(kgInput);
  setGrid.appendChild(repInput);
  setsContainer.appendChild(setGrid);
}

function saveWorkout(){
  const exercise = document.getElementById("exerciseName").value.trim();

  if(!exercise){
    alert("種目名を入力してください");
    return;
  }

  const sets = [];

  for(let i=1;i<=5;i++){
    const kg = document.getElementById(`kg${i}`).value.trim();
    const rep = document.getElementById(`rep${i}`).value.trim();

    if(kg || rep){
      sets.push({
        kg:kg || "-",
        rep:rep || "-"
      });
    }
  }

  if(sets.length === 0){
    alert("セット情報を1つ以上入力してください");
    return;
  }

  const data = {
    id:Date.now(),
    exercise,
    sets,
    date:new Date().toLocaleString("ja-JP")
  };

  const history = JSON.parse(localStorage.getItem("ironlog") || "[]");
  history.unshift(data);
  localStorage.setItem("ironlog", JSON.stringify(history));

  clearInputs();
  renderExerciseList();
  renderHistory();
  showSuccessMessage();
}

function clearInputs(){
  document.getElementById("exerciseName").value="";

  for(let i=1;i<=5;i++){
    document.getElementById(`kg${i}`).value="";
    document.getElementById(`rep${i}`).value="";
  }
}

function deleteWorkout(id){
  if(!confirm("この記録を削除しますか？")){
    return;
  }

  const history = JSON.parse(localStorage.getItem("ironlog") || "[]");
  const newHistory = history.filter(item => item.id !== id);
  localStorage.setItem("ironlog", JSON.stringify(newHistory));
  renderHistory();
  renderExerciseList();
}

function renderHistory(){
  const historyEl = document.getElementById("historyDrawer");
  const history = JSON.parse(localStorage.getItem("ironlog") || "[]");

  if(history.length === 0){
    const emptyMsg = document.createElement("div");
    emptyMsg.className = "empty-message";
    emptyMsg.textContent = "まだ記録がありません。";
    historyEl.innerHTML = "";
    historyEl.appendChild(emptyMsg);
    return;
  }

  historyEl.innerHTML = "";

  history.forEach(item => {
    const drawerItem = document.createElement("div");
    drawerItem.className = "drawer-item";

    const title = document.createElement("strong");
    title.textContent = item.exercise;

    const date = document.createElement("div");
    date.className = "small";
    date.textContent = item.date;

    const setsDiv = document.createElement("div");
    setsDiv.className = "drawer-item-sets";

    item.sets.forEach((set, index) => {
      const setInfo = document.createElement("div");
      setInfo.textContent = `${index + 1}セット目： ${set.kg}kg × ${set.rep}回`;
      setsDiv.appendChild(setInfo);
    });

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "delete-btn";
    deleteBtn.textContent = "削除";
    deleteBtn.style.marginTop = "8px";
    deleteBtn.onclick = () => deleteWorkout(item.id);

    drawerItem.appendChild(title);
    drawerItem.appendChild(date);
    drawerItem.appendChild(setsDiv);
    drawerItem.appendChild(deleteBtn);

    historyEl.appendChild(drawerItem);
  });
}

function renderExerciseList(){
  const listEl = document.getElementById("exerciseList");
  const history = JSON.parse(localStorage.getItem("ironlog") || "[]");

  // 種目名を集計
  const exerciseMap = {};
  history.forEach(item => {
    if(!exerciseMap[item.exercise]){
      exerciseMap[item.exercise] = 0;
    }
    exerciseMap[item.exercise]++;
  });

  // 使用回数でソート
  const sortedExercises = Object.entries(exerciseMap)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(entry => entry[0]);

  if(sortedExercises.length === 0){
    listEl.innerHTML = "";
    return;
  }

  listEl.innerHTML = "<div class='small' style='margin-bottom:8px;color:#9ca3af'>最近の種目：</div>";

  sortedExercises.forEach(exercise => {
    const btn = document.createElement("button");
    btn.className = "exercise-btn";
    btn.textContent = exercise;
    btn.onclick = () => {
      document.getElementById("exerciseName").value = exercise;
    };
    listEl.appendChild(btn);
  });
}

function openDrawer(){
  document.getElementById("drawer").classList.add("show");
  document.getElementById("drawerOverlay").classList.add("show");
}

function closeDrawer(){
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("drawerOverlay").classList.remove("show");
}

renderHistory();
renderExerciseList();
</script>

</body>
</html>
