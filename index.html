<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON LOG</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f6f8;
  color:#17202a;
}
header{
  background:#2563eb;
  color:#fff;
  padding:24px;
  text-align:center;
  box-shadow:0 4px 16px rgba(0,0,0,.12);
}
header h1{margin:0;font-size:30px}
header p{margin:6px 0 0;opacity:.9}
main{
  max-width:760px;
  margin:auto;
  padding:16px 16px 90px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 24px rgba(15,23,42,.08);
}
h2{margin-top:0}
label{
  display:block;
  font-weight:700;
  margin-top:12px;
}
select,input,button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #d8dee6;
  font-size:16px;
}
button{
  border:none;
  font-weight:700;
  cursor:pointer;
}
.primary{background:#2563eb;color:#fff;margin-top:16px}
.orange{background:#f97316;color:#fff;margin-top:10px}
.gray{background:#e5e7eb;color:#111827}
.danger{background:#ef4444;color:#fff}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}
.inputUnit{
  position:relative;
}
.inputUnit span{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:#6b7280;
  font-weight:700;
}
.inputUnit input{
  padding-right:44px;
}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:16px;
}
.tab{
  background:#e5e7eb;
  color:#111827;
}
.tab.active{
  background:#2563eb;
  color:white;
}
.hidden{display:none}
.record{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  margin-top:12px;
}
.recordTitle{
  font-weight:800;
  font-size:18px;
}
.sets{
  color:#4b5563;
  margin:8px 0;
  line-height:1.7;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.dateTitle{
  margin-top:18px;
  padding:10px;
  background:#eef2ff;
  border-radius:12px;
  font-weight:800;
}
.empty{
  color:#6b7280;
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>
<header>
  <h1>IRON LOG</h1>
  <p>筋トレ記録メモ</p>
</header>

<main>

  <div class="tabs">
    <button class="tab active" data-page="inputPage">入力</button>
    <button class="tab" data-page="historyPage">履歴</button>
  </div>

  <section id="inputPage">
    <div class="card">
      <h2>トレーニング入力</h2>

      <label>日付</label>
      <input type="date" id="date">

      <label>種目</label>
      <select id="exercise"></select>

      <div class="row">
        <input type="text" id="newExercise" placeholder="種目を追加">
        <button class="orange" id="addExerciseBtn">追加</button>
      </div>

      <div id="setsArea"></div>

      <button class="primary" id="saveBtn">記録する</button>
    </div>
  </section>

  <section id="historyPage" class="hidden">
    <div class="card">
      <h2>履歴</h2>
      <div id="history"></div>
    </div>
  </section>

</main>

<script>
const STORAGE_KEY = "iron_log_records_v2";
const EXERCISE_KEY = "iron_log_exercises_v2";

let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
let exercises = JSON.parse(localStorage.getItem(EXERCISE_KEY)) || [
  "ベンチプレス",
  "スクワット",
  "デッドリフト",
  "ショルダープレス",
  "ラットプルダウン",
  "ダンベルカール"
];

let editId = null;

const dateInput = document.getElementById("date");
const exerciseSelect = document.getElementById("exercise");
const setsArea = document.getElementById("setsArea");
const historyArea = document.getElementById("history");
const saveBtn = document.getElementById("saveBtn");

dateInput.valueAsDate = new Date();

function saveStorage(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  localStorage.setItem(EXERCISE_KEY, JSON.stringify(exercises));
}

function renderExercises(){
  exerciseSelect.innerHTML = "";
  exercises.forEach(name=>{
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    exerciseSelect.appendChild(option);
  });
}

function renderSets(){
  setsArea.innerHTML = "";
  for(let i=1;i<=5;i++){
    const wrap = document.createElement("div");
    wrap.className = "row";
    wrap.innerHTML = `
      <div class="inputUnit">
        <input type="number" inputmode="decimal" id="kg${i}" placeholder="${i}セット目 重量">
        <span>kg</span>
      </div>
      <div class="inputUnit">
        <input type="number" inputmode="numeric" id="rep${i}" placeholder="${i}セット目 回数">
        <span>回</span>
      </div>
    `;
    setsArea.appendChild(wrap);
  }
}

function clearForm(){
  editId = null;
  saveBtn.textContent = "記録する";
  dateInput.valueAsDate = new Date();
  for(let i=1;i<=5;i++){
    document.getElementById("kg"+i).value = "";
    document.getElementById("rep"+i).value = "";
  }
}

function renderHistory(){
  historyArea.innerHTML = "";

  if(records.length === 0){
    historyArea.innerHTML = `<div class="empty">まだ記録がありません</div>`;
    return;
  }

  const sorted = [...records].sort((a,b)=> b.date.localeCompare(a.date));

  const grouped = {};
  sorted.forEach(record=>{
    if(!grouped[record.date]) grouped[record.date] = [];
    grouped[record.date].push(record);
  });

  Object.keys(grouped).forEach(date=>{
    const dateBox = document.createElement("div");
    dateBox.className = "dateTitle";
    dateBox.textContent = date;
    historyArea.appendChild(dateBox);

    grouped[date].forEach(record=>{
      const div = document.createElement("div");
      div.className = "record";

      const setsText = record.sets
        .filter(s => s.kg || s.rep)
        .map((s,i)=> `${i+1}セット目：${s.kg || 0}kg × ${s.rep || 0}回`)
        .join("<br>");

      div.innerHTML = `
        <div class="recordTitle">${record.exercise}</div>
        <div class="sets">${setsText || "入力なし"}</div>
        <div class="actions">
          <button class="gray editBtn" data-id="${record.id}">編集</button>
          <button class="danger deleteBtn" data-id="${record.id}">削除</button>
        </div>
      `;

      historyArea.appendChild(div);
    });
  });
}

document.getElementById("addExerciseBtn").addEventListener("click",()=>{
  const input = document.getElementById("newExercise");
  const name = input.value.trim();

  if(!name) return;

  if(!exercises.includes(name)){
    exercises.push(name);
    saveStorage();
    renderExercises();
  }

  exerciseSelect.value = name;
  input.value = "";
});

saveBtn.addEventListener("click",()=>{
  const sets = [];

  for(let i=1;i<=5;i++){
    sets.push({
      kg: document.getElementById("kg"+i).value,
      rep: document.getElementById("rep"+i).value
    });
  }

  const record = {
    id: editId || Date.now().toString(),
    date: dateInput.value,
    exercise: exerciseSelect.value,
    sets: sets
  };

  if(editId){
    records = records.map(r => r.id === editId ? record : r);
  }else{
    records.push(record);
  }

  saveStorage();
  clearForm();
  renderHistory();
  alert("保存しました");
});

historyArea.addEventListener("click",(e)=>{
  const id = e.target.dataset.id;
  if(!id) return;

  if(e.target.classList.contains("deleteBtn")){
    records = records.filter(record => record.id !== id);
    saveStorage();
    renderHistory();
    return;
  }

  if(e.target.classList.contains("editBtn")){
    const record = records.find(r => r.id === id);
    if(!record) return;

    editId = id;
    dateInput.value = record.date;
    exerciseSelect.value = record.exercise;

    for(let i=1;i<=5;i++){
      document.getElementById("kg"+i).value = record.sets[i-1]?.kg || "";
      document.getElementById("rep"+i).value = record.sets[i-1]?.rep || "";
    }

    saveBtn.textContent = "更新する";
    showPage("inputPage");
  }
});

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    showPage(btn.dataset.page);
  });
});

function showPage(pageId){
  document.getElementById("inputPage").classList.add("hidden");
  document.getElementById("historyPage").classList.add("hidden");
  document.getElementById(pageId).classList.remove("hidden");

  document.querySelectorAll(".tab").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.page === pageId);
  });

  renderHistory();
}

renderExercises();
renderSets();
renderHistory();
</script>
</body>
  </html>
